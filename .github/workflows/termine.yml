name: Termine aktualisieren
on:
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/update-termine.mjs
      - name: Änderungen speichern
        run: |
          if [ -n "$(git status --porcelain data/termine.json)" ]; then
            git config user.name "termine-bot"
            git config user.email "termine-bot@users.noreply.github.com"
            git add data/termine.json
            git commit -m "Termine aktualisiert"
            git push
          fi
